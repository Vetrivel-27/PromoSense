version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: promosense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promosense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promosense_pass}
      POSTGRES_DB: ${POSTGRES_DB:-promosense}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promosense_user} -d ${POSTGRES_DB:-promosense}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - promosense_network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: promosense_mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-promosense_user}:${POSTGRES_PASSWORD:-promosense_pass}@postgres:5432/mlflow_db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlartifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-promosense_user}:${POSTGRES_PASSWORD:-promosense_pass}@postgres:5432/mlflow_db
      --default-artifact-root /mlartifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    networks:
      - promosense_network

volumes:
  postgres_data:
    driver: local
  mlflow_artifacts:
    driver: local

networks:
  promosense_network:
    driver: bridge
