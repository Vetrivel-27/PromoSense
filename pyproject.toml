[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promosense"
version = "0.1.0"
description = "Causal Promotion & Pricing Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PromoSense Team" }
]
dependencies = [
    # Data Processing & Storage
    "polars>=0.20.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",
    "scipy>=1.11.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.25",
    "sqlmodel>=0.0.16",
    "alembic>=1.13.1",

    # Machine Learning & Forecasting
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "statsmodels>=0.14.1",

    # Causal Inference & Uplift Modeling
    "econml>=0.15.0",
    "scikit-uplift>=0.5.1",

    # Experiment Tracking
    "mlflow>=2.16.0",

    # API Backend
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "ipykernel>=6.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ml_pipeline", "backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "data",
    "notebooks",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "ml_pipeline"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --import-mode=importlib"
testpaths = [
    "ml_pipeline/tests",
    "backend/tests",
]
pythonpath = [
    ".",
]
